/* Review revision: navigation stays on the left at every viewport size. */
.app{grid-template-columns:232px minmax(0,1fr)}.main-column{min-width:0}
.app aside{position:sticky;top:0;height:100dvh;align-self:start;overflow-y:auto;padding:22px 16px;border-right:1px solid var(--line);border-bottom:0}

.app nav{flex-direction:column;overflow:visible;margin-top:0;gap:5px}.app nav button{white-space:normal;padding:11px 12px;font-size:13px;gap:9px;min-height:44px;flex-shrink:0}.app nav .icon{display:block;flex-shrink:0;width:20px;font-size:17px}
nav button[aria-disabled=true]{color:var(--muted);cursor:default}.nav-label{line-height:1.4}.nav-backdrop{display:none}
.app.nav-collapsed{grid-template-columns:72px minmax(0,1fr)}.nav-collapsed aside{padding:20px 10px}.nav-collapsed .sidebar-head{flex-direction:column;gap:16px}.nav-collapsed #nav-toggle{margin:0;width:36px}.nav-collapsed .brand span,.nav-collapsed .workspace,.nav-collapsed .nav-label,.nav-collapsed .plan{display:none}.nav-collapsed nav{margin-top:28px}.nav-collapsed nav button{justify-content:center;padding:11px 0;width:100%}.nav-collapsed .brand img{width:35px;height:35px}
@media(max-width:1000px){.app{grid-template-columns:232px minmax(0,1fr)}}
@media(max-width:650px){
 .app,.app.nav-collapsed{display:grid;grid-template-columns:56px minmax(0,1fr)}

let navCollapsed=matchMedia('(max-width:900px)').matches;try{const saved=localStorage.getItem('piggybot.ux.pipeline.navCollapsed');if(saved!==null)navCollapsed=saved==='true';}catch{}
function toggleNav(){save();navCollapsed=!navCollapsed;try{localStorage.setItem('piggybot.ux.pipeline.navCollapsed',String(navCollapsed));}catch{}render();document.getElementById('nav-toggle')?.focus();}
addEventListener('keydown',e=>{if(e.key==='Escape'&&!navCollapsed&&matchMedia('(max-width:650px)').matches){e.preventDefault();toggleNav();}});
const t=k=>COPY[lang][k]||k;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amount=()=>({eco:3,standard:9,flagship:27}[model]),cap=()=>amount()+3;
const post=()=>`<div class="post"><div class="account"><div class="xlogo">𝕏</div><div><strong>Studio Demo</strong><small>@studio_demo</small></div></div><div class="postcontent">${esc(t('post'))}</div><div class="postfooter">${[...t('post')].length} / 280 ${t('characters')} · ${t('textonly')}</div></div>`;
const side=()=>`<div class="side"><section class="card pad"><div class="eyebrow">${t('summary')}</div><h3>${t('destination')}</h3><div class="account"><div class="xlogo">𝕏</div><div><strong>@studio_demo</strong><small>${t('textonly')}</small></div></div><span class="tag">● ${t('connected')}</span><dl class="facts"><dt>${t('scope')}</dt><dd>${t('onepost')}</dd><dt>${t('model')}</dt><dd>${esc(model[0].toUpperCase()+model.slice(1))}</dd><dt>${t('evidence')}</dt><dd>${t('evidencevalue')}</dd></dl></section><div class="hint"><strong>✓ ${t('guard')}</strong>${t('guardtext')}</div></div>`;
function content(){if(scene==='prepare')return `<div class="card"><div class="pad"><h2>${t('source')}</h2><p class="muted" style="font-size:13px">${t('sourcehelp')}</p><label for="source">${t('evidence')}</label><textarea id="source" class="source">${esc(drafts[lang]?.source||t('brief'))}</textarea><label for="goal">${t('goal')}</label><div class="dialogbox"><textarea id="goal">${esc(drafts[lang]?.goal||t('goaltext'))}</textarea><div class="modelrow"><span>${t('model')}</span><select aria-label="${t('model')}" id="model">${['eco','standard','flagship'].map(v=>`<option value="${v}" ${model===v?'selected':''}>${t(v)}</option>`).join('')}</select></div></div></div><div class="budget"><div class="row"><span class="label" style="margin:0">${t('costlabel')}</span><span class="big">≈ ${amount()} <small>${t('credits')}</small></span></div><p class="fine">${t('costnote').replace('{cap}',cap())}</p><button class="primary full" id="generate">${t('confirmgenerate')}</button><p class="fine" style="text-align:center;margin-bottom:0">${t('nobroadcast')}</p></div></div>`;
if(scene==='generating'||scene==='posting')return `<div class="card status" role="status"><div class="spinner"></div><h2>${t(scene==='generating'?'working':'posting')}</h2><p class="muted">${t(scene==='generating'?'workhint':'posthint')}</p></div>`;
if(scene==='failed')return `<div class="card status"><div class="statusicon error">!</div><h2>${t('failtitle')}</h2><p class="muted">${t('failtext')}</p><button class="primary" id="retry">${t('retry')}</button></div>`;
if(scene==='done'||retained)return `<div class="card status"><div class="statusicon">${retained?'✓':'↗'}</div><h2>${t(retained?'saved':'resulttitle')}</h2><p class="muted">${t(retained?'retained':'resulthelp')}</p>${!retained?`<span class="tag">✓ ${t('channelstatus')}</span>`:''}<div class="successstats"><div><small>${t('used')}</small><strong>${amount()}</strong> <small>${t('credits')}</small></div><div><small>${t('returned')}</small><strong>3</strong> <small>${t('credits')}</small></div></div><details><summary>${t('viewdraft')}</summary>${post()}</details><button class="primary full" id="again">${t('again')}</button></div>`;
return `<div class="card"><div class="pad"><div class="row"><div class="eyebrow">${t('postlabel')}</div><span class="tag warm">${t('waiting')}</span></div><h2>${t('reviewtitle')}</h2><p class="muted" style="font-size:13px">${t('reviewhelp')}</p>${post()}<div class="row"><span style="font-size:12px;color:var(--muted)">${t('charged')} · <strong style="color:var(--ink)">${amount()} ${t('credits')}</strong></span><button class="link" id="edit">${t('edit')}</button></div><p class="fine" style="margin-bottom:0">${t('approvalfree')}</p></div><div class="reviewbar">${confirming?`<div class="inlineconfirm"><h3>${t('confirmtitle')}</h3><p>${t('confirmtext')}</p><div class="actions"><button id="back">${t('cancel')}</button><button class="primary" id="confirm">${t('confirm')}</button></div></div>`:`<label class="check"><input type="checkbox" id="checked" ${checked?'checked':''}>${t('check')}</label><div class="actions"><button id="hold">${t('hold')}</button><button class="primary" id="approve" ${checked?'':'disabled'}>${t('approve')}</button></div>`}</div></div>`;}
function render(){document.documentElement.lang=lang;const idx=['prepare','generating','failed'].includes(scene)?0:scene==='done'||scene==='posting'||retained?2:1;
document.querySelector('#app').innerHTML=`<div class="demo"><span>${t('demo')}</span><label style="display:flex;gap:7px;align-items:center;margin:0">${t('preview')}<select id="preview">${['prepare','review','done','failed'].map(s=>`<option value="${s}" ${s===scene?'selected':''}>${t(s)}</option>`).join('')}</select></label></div><div class="app ${navCollapsed?'nav-collapsed':'nav-expanded'}"><aside id="sidebar" aria-label="${t('workspace')}"><div class="sidebar-head"><div class="brand"><img src="${LOGO}" alt="Piggybot"> <span>Piggybot<small>${t('tagline')}</small></span></div><button id="nav-toggle" aria-controls="primary-navigation" aria-expanded="${!navCollapsed}" aria-label="${t(navCollapsed?'expandNav':'collapseNav')}" title="${t(navCollapsed?'expandNav':'collapseNav')}"><span aria-hidden="true">${navCollapsed?'›':'‹'}</span></button></div><div class="workspace">STUDIO DEMO</div><nav id="primary-navigation" aria-label="${t('workspace')}">${[['current','✧'],['queue','☑'],['library','▤'],['publish','↗'],['channels','⌘'],['activity','◷'],['settings','⚙']].map(([k,i])=>`<button aria-label="${t(k)}" title="${t(k)}" ${k==='publish'?'class="current" aria-current="page"':'aria-disabled="true"'}><span class="icon" aria-hidden="true">${i}</span><span class="nav-label">${t(k)}</span></button>`).join('')}</nav><div class="plan"><strong>${t('paid')}</strong><div class="meter"><span></span></div>${t('balance')} · 1,850</div></aside>${!navCollapsed?`<button class="nav-backdrop" id="nav-backdrop" aria-label="${t('closeNav')}" tabindex="-1"></button>`:''}<div class="main-column"><header class="top"><span>${t('workspace')} <span style="margin:0 8px">/</span> ${t('publish')}</span><select id="language" aria-label="Language"><option value="zh" ${lang==='zh'?'selected':''}>简体中文</option><option value="en" ${lang==='en'?'selected':''}>English</option><option value="es" ${lang==='es'?'selected':''}>Español</option></select></header><main><div class="eyebrow">PUBLISH WITH PIGGYBOT</div><h1>${t('title')}</h1><p class="muted">${t('subtitle')}</p><div class="steps">${['prepare','review','done'].map((s,i)=>`<div class="step ${i===idx?'active':''}" ${i===idx?'aria-current="step"':''}><span class="num">${i<idx?'✓':i+1}</span>${t(s)}</div>`).join('')}</div>${notice?`<div class="notice" role="status">${t('kept')}</div>`:''}<div class="row" style="margin-bottom:15px"><strong style="font-size:13px">${t('pipeline')}</strong><span class="muted" style="font-size:11px">${idx===0?t('draft'):idx===1?t('waiting'):t(retained?'saved':'success')}</span></div><div class="layout">${content()}${side()}</div></main></div></div><button class="help" id="help">? ${t('help')}</button>`;
const on=(id,event,fn)=>document.getElementById(id)?.addEventListener(event,fn);
on('nav-toggle','click',toggleNav);on('nav-backdrop','click',toggleNav);
on('language','change',e=>{save();lang=e.target.value;render()});on('preview','change',e=>{save();scene=e.target.value;checked=false;confirming=false;notice=false;retained=false;render()});on('model','change',e=>{save();model=e.target.value;render()});
on('generate','click',()=>{save();scene='generating';render();setTimeout(()=>{scene='review';checked=false;render()},800)});on('checked','change',e=>{checked=e.target.checked;document.getElementById('approve').disabled=!checked});on('approve','click',()=>{confirming=true;render()});on('back','click',()=>{confirming=false;render()});on('confirm','click',()=>{scene='posting';confirming=false;render();setTimeout(()=>{scene='done';render()},800)});on('hold','click',()=>{retained=true;render()});on('edit','click',()=>{scene='prepare';checked=false;confirming=false;notice=false;render()});on('again','click',()=>{scene='prepare';checked=false;confirming=false;notice=false;retained=false;render()});on('retry','click',()=>{scene='review';notice=true;render()});on('help','click',()=>{const d=document.querySelector('#support');d.innerHTML=`<h2>${t('helphead')}</h2><p class="muted">${t('helptext')}</p><textarea aria-label="${t('helptext')}"></textarea><button class="primary" id="send">${t('send')}</button><button style="margin-left:8px" id="close">${t('cancel')}</button><p id="helpstatus" role="status"></p>`;d.showModal();d.querySelector('#close').onclick=()=>d.close();d.querySelector('#send').onclick=()=>d.querySelector('#helpstatus').textContent=t('sent')});}
function save(){const source=document.getElementById('source'),goal=document.getElementById('goal');if(source&&goal)drafts[lang]={source:source.value,goal:goal.value};}
render();
</script></body></html>
