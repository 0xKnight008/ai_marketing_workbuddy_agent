name: Workspace browsers and accessibility
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: V6 ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Match package-lock.json; browsers and apt dependencies are already installed.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify preinstalled browsers
        # Firefox requires the home directory to belong to the container user.
        env:
          HOME: /root
        run: node scripts/check-playwright-browsers.mjs
      - run: npx playwright test --project=${{ matrix.browser }} --global-timeout=1200000
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
