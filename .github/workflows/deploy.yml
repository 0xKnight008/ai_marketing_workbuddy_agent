name: Validate and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 支持手动触发

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            platform/package-lock.json
            ai-runtime/package-lock.json

      - name: Verify public npm registries
        run: npm run check:lockfile-registries

      - name: Install public API dependencies
        working-directory: server
        run: npm ci

      - name: Test subscription endpoint
        working-directory: server
        run: node --test subscribe-server.test.mjs
      
      - name: Install website dependencies
        run: npm ci

      - name: Install platform dependencies
        working-directory: platform
        run: npm ci

      - name: Install AI runtime dependencies
        working-directory: ai-runtime
        run: npm ci

      - name: Typecheck platform
        working-directory: platform
        run: npm run typecheck

      - name: Test platform
        working-directory: platform
        run: npm test

      - name: Typecheck AI runtime
        working-directory: ai-runtime
        run: npm run typecheck

      - name: Test AI runtime
        working-directory: ai-runtime
        run: npm test

      - name: Build AI runtime
        working-directory: ai-runtime
        run: npm run build

      # 4. 构建项目（含 TypeScript 检查）
      - name: Build project
        env:
          VITE_GATEWAY_URL: ${{ vars.PRODUCTION_GATEWAY_URL }}
          VITE_PUBLIC_CHECKOUT_ENABLED: ${{ vars.PUBLIC_CHECKOUT_ENABLED || 'false' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build
      
      # 5. 准备部署文件包
      - name: Prepare deployment package
        if: github.event_name != 'pull_request'
        run: |
          # 创建部署目录
          mkdir -p deploy-package
          
          # 复制 dist 目录内容到部署包
          cp -r dist/* deploy-package/
          
          # 复制 Docker 相关文件
          cp Dockerfile.fixed deploy-package/
          cp Dockerfile.subscribe deploy-package/
          cp nginx.conf deploy-package/
          cp docker-compose.yml deploy-package/
          cp -r server deploy-package/
          cp -r platform ai-runtime deploy-package/
          cp scripts/deploy-production.sh deploy-package/deploy.sh
          chmod +x deploy-package/deploy.sh
          
          # 打包所有文件
          tar -czf deploy.tar.gz -C deploy-package .
      
      # 6. 上传构建产物（用于调试）
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      # 7. 复制部署包到服务器
      - name: Copy deployment package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"
      
      # 8. 在服务器上解压并部署
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 设置部署目录
            DEPLOY_DIR="/opt/ai-marketing-agent"
            
            echo "📁 Preparing deployment directory..."
            sudo mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            
            # 解压部署包
            echo "📦 Extracting deployment package..."
            sudo tar -xzf /tmp/deploy.tar.gz
            #rm /tmp/deploy.tar.gz
            
            # 执行部署脚本
            echo "🚀 Running deployment script..."
            DEPLOY_DIR="$DEPLOY_DIR" bash deploy.sh
