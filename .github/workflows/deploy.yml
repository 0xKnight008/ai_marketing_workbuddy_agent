name: Build and Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:  # 支持手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # 2.1 升级 npm 到稳定版本
      - name: Upgrade npm
        run: npm install -g npm@10

      - name: Test subscription endpoint
        run: node --test server/subscribe-server.test.mjs
      
      # 3. 安装依赖
      - name: Install dependencies
        run: |
          echo "===== npm 版本信息 ====="
          node --version
          npm --version
          
          echo "===== 清理旧文件 ====="
          rm -rf node_modules package-lock.json
          
          echo "===== 安装依赖（使用 --legacy-peer-deps 避免依赖冲突） ====="
          npm install --legacy-peer-deps --no-audit --no-fund
          
          echo "===== 验证安装结果 ====="
          ls node_modules | wc -l
          test -d node_modules/vite && echo "✅ vite 已安装" || (echo "❌ vite 未安装" && exit 1)
          test -d node_modules/react && echo "✅ react 已安装" || (echo "❌ react 未安装" && exit 1)
      
      # 4. 构建项目（使用 CI 专用脚本，跳过类型检查）
      - name: Build project
        run: npm run build:ci
      
      # 5. 准备部署文件包
      - name: Prepare deployment package
        run: |
          # 创建部署目录
          mkdir -p deploy-package
          
          # 复制 dist 目录内容到部署包
          cp -r dist/* deploy-package/
          
          # 复制 Docker 相关文件
          cp Dockerfile.fixed deploy-package/
          cp Dockerfile.subscribe deploy-package/
          cp nginx.conf deploy-package/
          cp docker-compose.yml deploy-package/
          cp -r server deploy-package/
          
          # 创建部署脚本
          cat > deploy-package/deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "=========================================="
          echo "🚀 Starting deployment..."
          echo "=========================================="
          
          # 删除旧镜像（释放空间）
          # echo "🗑️  Removing old image..."
          # sudo docker rmi ai-marketing-agent:latest 2>/dev/null || echo "No old image to remove"
          
          # 构建新镜像
          echo "🔨 Building new Docker image..."
          sudo docker build -f Dockerfile.fixed -t ai-marketing-agent:latest .

          echo "🔨 Building subscription API image..."
          sudo docker compose build newsletter-api

          # 停止并删除旧容器
          echo "📦 Stopping old container..."
          cd /opt/ai-marketing-agent/ && sudo docker compose down ai-markting-front || true
          
          # 启动服务
          echo "🚀 Starting services with docker-compose..."
          cd /opt/ai-marketing-agent/ && sudo docker compose up -d
          
          # 等待容器启动
          sleep 3
          
          # 检查容器状态
          echo "✅ Checking container status..."
          sudo docker compose ps
          
          # 显示日志
          echo "📄 Container logs (last 20 lines):"
          sudo docker logs --tail 20 ai-markting-front || true
          
          # 清理悬空镜像
          echo "🧹 Cleaning up dangling images..."
          sudo docker image prune -f || true
          
          echo "=========================================="
          echo "✨ Deployment completed successfully!"
          echo "=========================================="
          EOF
          
          chmod +x deploy-package/deploy.sh
          
          # 打包所有文件
          tar -czf deploy.tar.gz -C deploy-package .
      
      # 6. 上传构建产物（用于调试）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          retention-days: 7
      
      # 7. 复制部署包到服务器
      - name: Copy deployment package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"
      
      # 8. 在服务器上解压并部署
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 设置部署目录
            DEPLOY_DIR="/opt/ai-marketing-agent"
            
            echo "📁 Preparing deployment directory..."
            sudo mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            
            # 解压部署包
            echo "📦 Extracting deployment package..."
            sudo tar -xzf /tmp/deploy.tar.gz
            #rm /tmp/deploy.tar.gz
            
            # 执行部署脚本
            echo "🚀 Running deployment script..."
            bash deploy.sh
