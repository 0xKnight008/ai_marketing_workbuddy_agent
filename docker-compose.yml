version: "3.8"
services:
  ai-markting-front:
    image: ai-marketing-agent:latest
    pull_policy: never  # 使用本地构建的镜像
    container_name: ai-markting-front
    restart: unless-stopped
    networks:
      - ss_prod
    ports:
      - "8001:80"
    environment:
      - APP_ENV=production
    deploy:
      replicas: 1

  newsletter-api:
    build:
      context: .
      dockerfile: Dockerfile.subscribe
    image: ai-marketing-subscribe-api:latest
    pull_policy: never
    container_name: ai-marketing-subscribe-api
    restart: unless-stopped
    networks:
      - ss_prod
    environment:
      NODE_ENV: production
      PORT: "3001"
      GOOGLE_FORM_ID: ${GOOGLE_FORM_ID:-1FAIpQLSf0snTCY6aXd-eREWUYHvfHUPsdAxRLiCW2KxJanUQomT0ncA}
      GOOGLE_FORM_EMAIL_ENTRY: ${GOOGLE_FORM_EMAIL_ENTRY:-1237653730}

networks:
  ss_prod:
    external: true
