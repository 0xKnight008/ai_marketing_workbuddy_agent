version: "3.8"
services:
  ai-markting-front:
    image: ai-marketing-agent:latest
    pull_policy: never  # 使用本地构建的镜像
    container_name: ai-markting-front
    restart: unless-stopped
    networks:
      - ss_prod
    ports:
      # Nginx is the only public ingress in production.
      - "127.0.0.1:8001:80"
    environment:
      - APP_ENV=production
    deploy:
      replicas: 1

  newsletter-api:
    build:
      context: .
      dockerfile: Dockerfile.subscribe
    image: ai-marketing-subscribe-api:latest
    pull_policy: never
    container_name: ai-marketing-subscribe-api
    restart: unless-stopped
    ports:
      # 宿主机 nginx 将 /api/subscribe、/api/feedback、/r/* 反代到 127.0.0.1:3001。
      # 仅绑定回环地址，不对外暴露。
      - "127.0.0.1:3001:3001"
    networks:
      - ss_prod
    env_file:
      - ${PUBLIC_API_ENV_FILE:-/etc/piggybot/public-api.env}
    environment:
      NODE_ENV: production
      PORT: "3001"

networks:
  ss_prod:
    external: true
