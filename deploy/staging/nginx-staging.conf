# Piggybot STAGING site — install as /etc/nginx/sites-available/piggybot-staging
# and symlink into sites-enabled. Cloudflare sits in front; only 80/443 are
# public. Ports 4200/4211 stay loopback-only, exactly like production.
#
# TLS: after creating the staging.piggybot.me DNS record, run
#   sudo certbot --nginx -d staging.piggybot.me
# certbot rewrites this file with the listen-443 and certificate blocks.
#
# Staging is not a public product surface. Keep it private with ONE of:
#   - Cloudflare Access / WAF IP allowlist on the staging hostname (preferred), or
#   - HTTP basic auth: `sudo htpasswd -c /etc/nginx/.htpasswd-staging <user>`
#     then uncomment the auth_basic lines below.

server {
    listen 80;
    server_name staging.piggybot.me;

    root /opt/ai-marketing-agent-staging/dist;
    index index.html;

    # auth_basic "piggybot staging";
    # auth_basic_user_file /etc/nginx/.htpasswd-staging;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location /api/ {
        client_max_body_size 16m; # JSON escaping overhead; decoded imports are capped at 2 MiB
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stripe TEST-mode webhook endpoint for staging checkout rehearsals.
    location = /webhooks/stripe {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal endpoints are loopback-only; the public surface must 404 them.
    location ^~ /internal/ {
        return 404;
    }

    # SPA fallback: unmatched paths serve the staging frontend build.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
